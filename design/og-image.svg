<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <radialGradient id="fade" cx="0.85" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="m"><rect width="1200" height="630" fill="url(#fade)"/></mask>
  </defs>
  <rect width="1200" height="630" fill="#0d0d0f"/>
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#m)"/>

  <g transform="translate(80 80)">
    <rect x="0" y="0" width="46" height="9" rx="2.5" fill="#ededeb"/>
    <rect x="0" y="16" width="33" height="9" rx="2.5" fill="#aba1f6"/>
    <rect x="0" y="32" width="20" height="9" rx="2.5" fill="#ededeb" fill-opacity="0.5"/>
  </g>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="80" y="230" fill="#82828b" font-family="Menlo, monospace" font-size="20" letter-spacing="3">SENIOR FULL-STACK DEVELOPER &#183; KOCHI, INDIA</text>
    <text x="78" y="330" fill="#ededeb" font-size="92" font-weight="500" letter-spacing="-3">Sreekutty M R</text>
    <text x="80" y="400" fill="#a3a3ab" font-size="34" letter-spacing="-0.5">I build web applications from the interface</text>
    <text x="80" y="446" fill="#a3a3ab" font-size="34" letter-spacing="-0.5">down to the database.</text>
    <text x="80" y="550" fill="#ededeb" fill-opacity="0.8" font-family="Menlo, monospace" font-size="20">React &#183; TypeScript &#183; Node.js &#183; NestJS &#183; PostgreSQL</text>
  </g>

  <g transform="translate(900 120)" fill="none" stroke="#ffffff" stroke-opacity="0.16">
    <rect x="0" y="0" width="220" height="100" rx="10" stroke-dasharray="3 5"/>
    <rect x="0" y="140" width="220" height="100" rx="10" stroke-dasharray="3 5"/>
    <rect x="0" y="280" width="220" height="100" rx="10" stroke-dasharray="3 5"/>
    <path d="M110 100 V140 M110 240 V280" stroke="#aba1f6" stroke-opacity="1" stroke-width="2"/>
    <rect x="30" y="170" width="160" height="40" rx="7" fill="#aba1f6" fill-opacity="0.12" stroke="#aba1f6" stroke-opacity="1"/>
  </g>
</svg>
